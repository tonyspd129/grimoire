name: PR Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  summarize:
    name: Summarize changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD --stat --no-color)
          PATCH=$(git diff origin/${{ github.base_ref }}...HEAD --no-color | head -c 12000)
          echo "stat<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "patch<<EOF" >> $GITHUB_OUTPUT
          echo "$PATCH" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Summarize with Claude via OpenRouter
        id: summary
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "text=_OPENROUTER_API_KEY secret not configured — skipping AI summary._" >> $GITHUB_OUTPUT
            exit 0
          fi

          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          STAT="${{ steps.diff.outputs.stat }}"
          PATCH="${{ steps.diff.outputs.patch }}"

          PROMPT="You are the automated reviewer for Grimoire — a local-first Tauri desktop AI agent (Rust + React/TypeScript).

          ## Grimoire's core principles (use these to evaluate alignment)
          1. LOCAL-FIRST: zero servers, zero telemetry, zero accounts. Only network traffic allowed is machine → LLM provider APIs.
          2. SKILLS ARE NEVER DELETED: only superseded or archived. Lifecycle: draft → active → validated → expert.
          3. CLEAN EXTENSION CONTRACTS: providers in src/lib/providers/, skills in resources/skills/, tools in src/lib/agent/tools.ts.
          4. types.ts IS FROZEN: src/lib/providers/types.ts is the public OSS contract. It must never be modified by contributors.
          5. RUST FOR SYSTEM OPS, TYPESCRIPT FOR LLM CALLS: no LLM calls in Rust, no shell exec in TypeScript renderer.
          6. OUT OF SCOPE: web apps, SaaS features, vector DBs, RAG pipelines, code editors, multi-agent orchestration.

          ## PR to review
          Title: ${PR_TITLE}
          Description: ${PR_BODY}

          File changes:
          ${STAT}

          Diff (first 12KB):
          \`\`\`diff
          ${PATCH}
          \`\`\`

          Write a review in this exact format:

          ## Summary
          [1-3 sentences: what this PR does and why]

          ## What changed
          | Area | Change |
          |------|--------|
          [one row per affected component: providers / agent / learning / skills / Rust / UI / CI / docs]

          ## Goal alignment
          **Verdict**: ✅ Aligned / ⚠️ Partially aligned / ❌ Out of scope
          [1-2 sentences: does this PR serve Grimoire's mission — a local-first agent that learns from sessions? Call out any principle violations clearly: server calls, types.ts edits, LLM calls in Rust, scope creep, skill deletion logic, etc. If aligned, say so briefly.]

          ## Risk
          **Level**: Low / Medium / High
          **Reason**: [one sentence]

          ## Review focus
          - [1-3 specific things reviewers should look at closely]

          Be direct. No filler. If the diff is truncated, note it. For the Goal alignment section, be strict — Grimoire's principles exist to keep it local-first and contributor-friendly."

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "X-Title: Grimoire PR Summary" \
            -d "{
              \"model\": \"anthropic/claude-haiku-4-5\",
              \"max_tokens\": 1500,
              \"messages\": [{
                \"role\": \"user\",
                \"content\": $(echo "$PROMPT" | jq -Rs .)
              }]
            }")

          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "Summary generation failed."')
          echo "text<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post or update comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- grimoire-pr-summary -->';
            const summary = `${marker}\n${{ steps.summary.outputs.text }}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary,
              });
            }
