name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ============================================================================
  # Commit message lint — every commit on the PR must follow conventional commits
  # ============================================================================
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Lint commits from base to HEAD
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  # ============================================================================
  # PR description check — must not be the raw template
  # ============================================================================
  pr-check:
    name: PR description
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            if (body.trim().length < 50) {
              core.setFailed('PR description is too short. Fill out the PR template.');
            }
            if (body.includes('What problem does this solve?') && !body.replace('What problem does this solve?', '').trim()) {
              core.setFailed('PR description looks like an unfilled template.');
            }

  # ============================================================================
  # TypeScript type check
  # ============================================================================
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  # ============================================================================
  # TypeScript unit tests (Vitest)
  # ============================================================================
  test-ts:
    name: Unit tests (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --run

  # ============================================================================
  # Rust check + clippy + tests
  # ============================================================================
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
